name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      UV_LINK_MODE: copy

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: "0.10.7"

      - name: Install Python
        run: uv python install 3.14.3

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Lint
        run: uv run ruff check src tests

      - name: Type check
        run: uv run mypy src tests

      - name: Test
        run: uv run pytest -q

      - name: Build package
        run: uv build